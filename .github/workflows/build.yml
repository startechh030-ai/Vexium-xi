name: 🔨 Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🏗️ Build APK & Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🔍 Run Lint
        run: ./gradlew lintDebug --continue

      - name: 📋 Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 1

      - name: 🧪 Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: 📋 Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 1

      - name: 🔨 Build Debug APK (release-signed)
        run: ./gradlew assembleDebug

      - name: 🔨 Build Release APK
        run: ./gradlew assembleRelease

      - name: 📏 APK Info
        run: |
          echo "### 📦 APK Info" >> $GITHUB_STEP_SUMMARY
          for apk in $(find app/build/outputs/apk -name "*.apk"); do
            APK_SIZE=$(du -h "$apk" | cut -f1)
            echo "- **$(basename $apk):** $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          done
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY

      - name: 📦 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vexium-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
          if-no-files-found: error

      - name: 📦 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vexium-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 1
          if-no-files-found: error

      - name: ✅ Build Summary
        if: success()
        run: echo "### ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Build Failed Summary
        if: failure()
        run: echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
